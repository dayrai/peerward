[workspace]
members = [
    "apps/peerward-console",
    "apps/peerward-android-ui",
    "apps/peerward-ui",
    "crates/peerward-api",
    "crates/peerward-carrier",
    "crates/peerward-android-core",
    "crates/peerward-cli",
    "crates/peerward-control",
    "crates/peerward-credentials",
    "crates/peerward-directory",
    "crates/peerward-dataplane",
    "crates/peerward-dioxus",
    "crates/peerward-load",
    "crates/peerward-management",
    "crates/peerward-platform",
    "crates/peerward-peer",
    "crates/peerward-peer-core",
    "crates/peerward-p2p",
    "crates/peerward-policy",
    "crates/peerward-relay",
    "crates/peerward-service",
    "crates/peerward-store",
    "crates/peerward-types",
    "crates/peerward-updater",
    "crates/peerward-wire",
    "crates/peerward-wireguard",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dayrai/peerward"
publish = false
rust-version = "1.95"

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "tokio"] }
base64 = "0.22"
bytes = "1.10"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
dioxus = { package = "peerward-dioxus", path = "crates/peerward-dioxus", default-features = false }
dioxus-core = "=0.7.10"
dioxus-core-macro = "=0.7.10"
dioxus-config-macros = "=0.7.10"
dioxus-hooks = "=0.7.10"
dioxus-html = "=0.7.10"
dioxus-signals = "=0.7.10"
dioxus-stores = "=0.7.10"
dioxus-ssr = "=0.7.10"
dioxus-fullstack-core = "=0.7.10"
dioxus-router = { version = "=0.7.10", default-features = false, features = ["html"] }
dioxus-web = { version = "=0.7.10", default-features = false }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
futures-util = "0.3"
gotatun = { version = "=0.9.2", default-features = false, features = ["ring"] }
hkdf = "0.12"
hex = "0.4"
idna = "1.1"
http-body-util = "0.1"
igd-next = { version = "0.17.1", features = ["aio_tokio"] }
ipnet = { version = "2.11", features = ["serde"] }
jni = "0.21"
libc = "0.2"
openidconnect = "4.0"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
prost = "0.14"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rtnetlink = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
snow = "0.10"
socket2 = "0.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "time"] }
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "parsing"] }
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
webpki-roots = "1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tokio-tun = "0.15.2"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.16", features = ["serde", "v4", "v7"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = "1.8"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
