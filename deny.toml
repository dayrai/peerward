[advisories]
version = 2
yanked = "deny"
ignore = [
    # Provider public-key verification only; Peerward performs no RSA private-key operation.
    # Owner: Peerward Security. Review quarterly; expires 2026-11-30.
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "deny"
unused-license-exception = "deny"
allow = [
    "Apache-2.0",
    # LLVM's exception permits linking and redistribution; this SPDX
    # expression is used by target-lexicon.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # Approved WireGuard session library; no device, TUN, or default backend.
    # Keep the upstream MPL text and source location in third_party/gotatun.
    { allow = ["MPL-2.0"], crate = "gotatun@0.9.2" },
    # igd-next's HTTP transport is an unmodified MPL-2.0 file-level copyleft
    # dependency used only for optional UPnP gateway mapping. Keep this scoped
    # to the reviewed release instead of allowing every future MPL dependency.
    { allow = ["MPL-2.0"], crate = "attohttpc@0.30.1" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
